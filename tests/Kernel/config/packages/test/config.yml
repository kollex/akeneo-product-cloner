doctrine:
    dbal:
        default_connection:   default
        connections:
            default:
                driver: 'pdo_mysql'
                dbname: '%env(APP_DATABASE_NAME)%'
                host: '%env(APP_DATABASE_HOST)%'
                port: '%env(APP_DATABASE_PORT)%'
                user: '%env(APP_DATABASE_USER)%'
                password: '%env(APP_DATABASE_PASSWORD)%'
                charset: utf8mb4
                default_table_options:
                    charset: utf8mb4
                    collate: utf8mb4_unicode_ci
                    row_format: DYNAMIC
                server_version: '8.0'
                mapping_types:
                    json: string
        types:
            datetime: Akeneo\Tool\Bundle\StorageUtilsBundle\Doctrine\DBAL\Types\UTCDateTimeType
    orm:
        auto_generate_proxy_classes: '%kernel.debug%'
        auto_mapping: true
        resolve_target_entities:
            placeholder: placeholder
        mappings:
            tree:
                type: annotation
                is_bundle: false
                alias: Gedmo
                prefix: Gedmo\Tree\Entity
                dir: '%kernel.project_dir%/../../vendor/gedmo/doctrine-extensions/src/Tree/Entity'

services:
    pim_user.entity_with_image.subscriber:
        class: 'Akeneo\\UserManagement\\Bundle\\EventListener\\UploadedImageSubscriber'
        arguments:
            - '%kernel.project_dir%/../../src'
